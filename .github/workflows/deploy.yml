name: Deploy to Railway

on:
  push:
    branches:
      - claude/pokemon-card-grader-eeyjT
    paths:
      - 'pokemon-grader/**'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy PokéGrader AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon-grader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pokemon-grader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          # The browser grading UI calls Anthropic directly — key is
          # baked into the bundle at build time (already client-visible by design).
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service pokegrade --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
