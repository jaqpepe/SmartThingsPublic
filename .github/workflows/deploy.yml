name: Deploy to Railway

on:
  push:
    branches:
      - claude/pokemon-card-grader-eeyjT
    paths:
      - 'pokemon-grader/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PokéGrader AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokemon-grader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pokemon-grader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}

      - name: Deploy to Railway
        uses: railwayapp/railway-github-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service: pokegrade
